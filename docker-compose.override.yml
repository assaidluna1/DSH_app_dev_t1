services:
  db:
    ports:
      - "5432:5432"

  backend:
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    ports:
      - "3000:80"
